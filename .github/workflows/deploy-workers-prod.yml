name: Deploy Workers to Production

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'assets/js/core/cloud-state-merge.js'
      - 'assets/js/core/cloud-payload.js'
      - 'assets/js/core/catalog-model.js'
      - 'assets/js/core/catalog-sync-protocol.js'
      - 'assets/constants/**'
      - 'assets/constants.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers (Production)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test before deploy
        run: node --experimental-vm-modules --test tests/*.test.mjs
      - name: Install pinned local Worker test runtime
        run: npm ci --prefix workers --ignore-scripts
      - name: Verify bundled Worker with local D1
        run: node tests/catalog-worker-local.mjs
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: deploy
