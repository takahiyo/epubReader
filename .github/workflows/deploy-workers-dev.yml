name: Deploy Workers to Development

on:
  push:
    branches:
      - dev
    paths:
      - 'workers/**'
      - 'assets/js/core/cloud-state-merge.js'
      - 'assets/js/core/cloud-payload.js'
      - 'assets/js/core/catalog-model.js'
      - 'assets/js/core/catalog-sync-protocol.js'
      - 'assets/constants/**'
      - 'assets/constants.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers (Dev)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test before deploy
        run: node --experimental-vm-modules --test tests/*.test.mjs
      - name: Install pinned local Worker test runtime
        run: npm ci --prefix workers --ignore-scripts
      - name: Verify bundled Worker with local D1
        run: node tests/catalog-worker-local.mjs
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: deploy --env dev
      - name: Configure Drive OAuth secret when supplied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        working-directory: workers
        shell: bash
        run: |
          if [ -n "$DRIVE_CLIENT_SECRET" ]; then
            printf '%s' "$DRIVE_CLIENT_SECRET" | npx --no-install wrangler secret put DRIVE_CLIENT_SECRET --env dev
          else
            echo 'Drive OAuth secret was not supplied; existing Worker secret is preserved.'
          fi
