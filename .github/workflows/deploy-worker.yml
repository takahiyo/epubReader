name: Validate Reader

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    name: Offline regression tests
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules --test tests/*.test.mjs
      - run: node scripts/generate-legal-pages.mjs
      - run: git diff --exit-code -- privacy.html terms.html privacy-en.html terms-en.html
      - run: node scripts/generate-sw-cache-config.mjs
      - run: git diff --exit-code -- assets/sw-cache-config.json
